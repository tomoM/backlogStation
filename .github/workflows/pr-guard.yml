name: PR Guard
on:
  pull_request_target:
    types: [opened]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR without linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // オーナー・コラボレーターはスキップ
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: pr.user.login
            }).catch(() => null);
            const level = permission?.data?.permission;
            if (level === 'admin' || level === 'write' || level === 'maintain') return;

            const body = pr.body || '';
            const hasIssueRef = /(?:#\d+|https:\/\/github\.com\/.+\/issues\/\d+)/.test(body);

            if (!hasIssueRef) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: 'このリポジトリでは事前にIssueでの議論なしのPRは受け付けていません。\nまずIssueを作成し、PRのbodyからリンクしてください。'
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }
