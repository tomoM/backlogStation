name: PR Guard
on:
  pull_request_target:
    types: [opened]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Detect AI and guard external PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';

            // --- AI検出 ---
            const aiPatterns = [
              /Co-Authored-By:.*\b(Claude|Copilot|ChatGPT|OpenAI|Gemini|Anthropic|Devin)\b/i,
              /Generated (with|by).*\b(Claude|Copilot|ChatGPT|OpenAI|Gemini|Cursor|Devin)\b/i,
              /\b(claude-code|aider|sweep\.dev|coderabbit)\b/i,
              /🤖/,
            ];

            const isBot = pr.user.login.endsWith('[bot]');
            const bodyOrTitleMatch = aiPatterns.some(p => p.test(body) || p.test(title));

            // コミットメッセージもチェック
            const commits = await github.rest.pulls.listCommits({
              ...context.repo,
              pull_number: pr.number,
              per_page: 10
            });
            const commitMatch = commits.data.some(c =>
              aiPatterns.some(p => p.test(c.commit.message))
            );

            const isAI = isBot || bodyOrTitleMatch || commitMatch;

            if (isAI) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pr.number,
                labels: ['AI']
              });
            }

            // --- 外部PR: Issueリンク必須 ---
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: pr.user.login
            }).catch(() => null);
            const level = permission?.data?.permission;
            if (level === 'admin' || level === 'write' || level === 'maintain') return;

            const hasIssueRef = /(?:#\d+|https:\/\/github\.com\/.+\/issues\/\d+)/.test(body);

            if (!hasIssueRef) {
              const aiNote = isAI ? '\n\n🤖 このPRはAI生成の可能性があると判定されました。' : '';
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: 'このリポジトリでは事前にIssueでの議論なしのPRは受け付けていません。\nまずIssueを作成し、PRのbodyからリンクしてください。' + aiNote
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }
